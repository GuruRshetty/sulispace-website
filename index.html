<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10131f">
  <title>Catch the Dot</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f7f5ff;
      --muted: #a5a8bd;
      --line: #30364b;
      --lime: #c9fa69;
      --pink: #ff7bb2;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      background: radial-gradient(ellipse at 50% 0%, #292643 0, #151827 48%, #10131f 100%);
    }

    .game { width: min(760px, 100%); }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin: 0 0 20px;
    }

    .eyebrow {
      margin: 0 0 7px;
      color: var(--lime);
      font-size: .72rem;
      font-weight: 800;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 6vw, 3.3rem);
      line-height: 1;
      letter-spacing: -.06em;
    }

    .stats { display: flex; gap: 10px; }

    .stat {
      min-width: 94px;
      padding: 11px 15px;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: #191d2d;
      text-align: center;
    }

    .stat span {
      display: block;
      color: var(--muted);
      font-size: .68rem;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .stat strong {
      display: block;
      margin-top: 3px;
      font-size: 1.55rem;
      font-variant-numeric: tabular-nums;
    }

    .arena {
      position: relative;
      height: min(58vh, 440px);
      min-height: 300px;
      overflow: hidden;
      border: 1px solid #353b52;
      border-radius: 26px;
      background-color: #171b29;
      background-image: radial-gradient(#41465b 1px, transparent 1px);
      background-size: 22px 22px;
      box-shadow: 0 24px 70px #05060b66, inset 0 1px #ffffff08;
    }

    .target {
      position: absolute;
      z-index: 1;
      width: 58px;
      height: 58px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      cursor: pointer;
      background: var(--lime);
      box-shadow: 0 0 0 8px #c9fa6925, 0 0 32px #c9fa6990;
      transform: translate(-50%, -50%);
      transition: width .12s, height .12s, filter .12s;
    }

    .target:hover { width: 64px; height: 64px; filter: brightness(1.1); }
    .target:active { width: 51px; height: 51px; }
    .target::after {
      content: "";
      position: absolute;
      inset: 20px;
      border-radius: 50%;
      background: #17201a;
    }

    .target[hidden], .overlay[hidden] { display: none; }

    .overlay {
      position: absolute;
      z-index: 2;
      inset: 0;
      display: grid;
      place-content: center;
      justify-items: center;
      padding: 24px;
      text-align: center;
      background: #141725ae;
      backdrop-filter: blur(5px);
    }

    .overlay h2 {
      margin: 0 0 9px;
      font-size: clamp(1.5rem, 5vw, 2.1rem);
      letter-spacing: -.04em;
    }

    .overlay p {
      max-width: 360px;
      margin: 0 0 20px;
      color: #c2c5d5;
      line-height: 1.6;
    }

    .action {
      padding: 13px 22px;
      border: 0;
      border-radius: 999px;
      color: #151a10;
      background: var(--lime);
      font: inherit;
      font-weight: 850;
      cursor: pointer;
      box-shadow: 0 6px 22px #c9fa6933;
      transition: transform .15s, filter .15s;
    }

    .action:hover { transform: translateY(-2px); filter: brightness(1.06); }

    footer {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      margin-top: 14px;
      color: var(--muted);
      font-size: .85rem;
    }

    kbd {
      padding: 2px 7px;
      border: 1px solid var(--line);
      border-radius: 6px;
      color: #e2e3ed;
      background: #1b1f2e;
      font: inherit;
    }

    @media (max-width: 520px) {
      body { padding: 18px; }
      header { align-items: flex-start; flex-direction: column; }
      .stats { width: 100%; }
      .stat { flex: 1; }
      .arena { height: 52vh; min-height: 280px; }
      footer { flex-direction: column; gap: 5px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="game">
    <header>
      <div>
        <p class="eyebrow">A tiny reflex game</p>
        <h1>Catch the Dot<span style="color:var(--pink)">.</span></h1>
      </div>
      <div class="stats" aria-label="Game statistics">
        <div class="stat"><span>Score</span><strong id="score">0</strong></div>
        <div class="stat">
          <span>Time</span>
          <strong><span id="time" style="display:inline;color:inherit;font-size:inherit;letter-spacing:normal;text-transform:none">30</span>s</strong>
        </div>
      </div>
    </header>

    <section class="arena" id="arena" aria-label="Game area">
      <button class="target" id="target" type="button" aria-label="Catch the dot" hidden></button>
      <div class="overlay" id="overlay">
        <h2 id="message">Ready, steady, click!</h2>
        <p id="description">Click the glowing dot as many times as you can in 30 seconds. It moves after every hit.</p>
        <button class="action" id="start" type="button">Start game</button>
      </div>
    </section>

    <footer>
      <span>Click the dot. Build your score.</span>
      <span>Tip: keep your cursor near the center <kbd>↗</kbd></span>
    </footer>
  </main>

  <script>
    const arena = document.querySelector("#arena");
    const target = document.querySelector("#target");
    const overlay = document.querySelector("#overlay");
    const scoreLabel = document.querySelector("#score");
    const timeLabel = document.querySelector("#time");
    const startButton = document.querySelector("#start");
    const message = document.querySelector("#message");
    const description = document.querySelector("#description");

    let score = 0;
    let time = 30;
    let timer = null;
    let playing = false;

    function moveTarget() {
      const padding = 38;
      const x = padding + Math.random() * Math.max(0, arena.clientWidth - padding * 2);
      const y = padding + Math.random() * Math.max(0, arena.clientHeight - padding * 2);

      target.style.left = `${x}px`;
      target.style.top = `${y}px`;
    }

    function endGame() {
      playing = false;
      clearInterval(timer);
      target.hidden = true;
      message.textContent = score >= 20
        ? "Unreal reflexes!"
        : score >= 10
          ? "Nice catching!"
          : "Time’s up!";
      description.textContent =
        `You caught the dot ${score} ${score === 1 ? "time" : "times"}. Want another round?`;
      startButton.textContent = "Play again";
      overlay.hidden = false;
    }

    function startGame() {
      score = 0;
      time = 30;
      playing = true;
      scoreLabel.textContent = score;
      timeLabel.textContent = time;
      overlay.hidden = true;
      target.hidden = false;
      moveTarget();

      clearInterval(timer);
      timer = setInterval(() => {
        time -= 1;
        timeLabel.textContent = time;

        if (time <= 0) endGame();
      }, 1000);
    }

    target.addEventListener("click", () => {
      if (!playing) return;
      score += 1;
      scoreLabel.textContent = score;
      moveTarget();
    });

    startButton.addEventListener("click", startGame);

    window.addEventListener("resize", () => {
      if (playing) moveTarget();
    });
  </script>
</body>
</html>
